name: Python Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and orchestrated pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      CHURN_PIPELINE_USE_SYNTHETIC_DATA: "true"
      MLFLOW_EXPERIMENT_NAME: "telco-customer-churn-ci"
      MLFLOW_REGISTERED_MODEL_NAME: "telco-churn-classifier-ci"
      MODEL_MIN_TEST_ROC_AUC: "0"
      MODEL_MIN_TEST_F1: "0"
      MODEL_MIN_TEST_RECALL: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure CI runtime paths
        shell: bash
        run: |
          mkdir -p \
            "$RUNNER_TEMP/airflow" \
            "$RUNNER_TEMP/raw" \
            "$RUNNER_TEMP/processed" \
            "$RUNNER_TEMP/features" \
            "$RUNNER_TEMP/mlflow"
          {
            echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow"
            echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/orchestration/dags"
            echo "TELCO_RAW_PATH=$RUNNER_TEMP/raw/telco_customer_churn.csv"
            echo "TELCO_DELTA_PATH=$RUNNER_TEMP/processed/telco_delta"
            echo "DBT_DUCKDB_PATH=$RUNNER_TEMP/features/churn_analytics.duckdb"
            echo "MLFLOW_TRACKING_URI=sqlite:///$RUNNER_TEMP/mlflow/mlflow.db"
          } >> "$GITHUB_ENV"

      - name: Install project and development dependencies
        run: pip install -e ".[dev,orchestration]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Initialize Airflow metadata
        run: airflow db migrate

      - name: Validate Airflow DAG discovery
        run: |
          airflow dags reserialize
          airflow dags list-import-errors
          airflow dags list | grep mlops_customer_churn_pipeline

      - name: Execute orchestrated synthetic pipeline
        run: >-
          airflow dags test mlops_customer_churn_pipeline
          --dagfile-path "${{ github.workspace }}/orchestration/dags/churn_mlops_pipeline.py"
