name: Python Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project and development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Create synthetic Delta fixture
        run: >-
          python -m churn_platform.spark.create_test_fixture
          --output "${{ runner.temp }}/telco_customer_churn_delta"

      - name: Validate dbt connection
        env:
          TELCO_DELTA_PATH: "${{ runner.temp }}/telco_customer_churn_delta"
          DBT_DUCKDB_PATH: "${{ runner.temp }}/churn_analytics.duckdb"
        run: dbt debug --project-dir dbt_project --profiles-dir dbt_project

      - name: Build and test dbt project
        env:
          TELCO_DELTA_PATH: "${{ runner.temp }}/telco_customer_churn_delta"
          DBT_DUCKDB_PATH: "${{ runner.temp }}/churn_analytics.duckdb"
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Train and track candidate models
        env:
          DBT_DUCKDB_PATH: "${{ runner.temp }}/churn_analytics.duckdb"
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow/mlflow.db"
          MLFLOW_EXPERIMENT_NAME: "telco-customer-churn-ci"
        run: python -m churn_platform.ml.train

      - name: Register, promote, and reload champion
        env:
          DBT_DUCKDB_PATH: "${{ runner.temp }}/churn_analytics.duckdb"
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow/mlflow.db"
          MLFLOW_EXPERIMENT_NAME: "telco-customer-churn-ci"
          MLFLOW_REGISTERED_MODEL_NAME: "telco-churn-classifier-ci"
          MODEL_MIN_TEST_ROC_AUC: "0"
          MODEL_MIN_TEST_F1: "0"
          MODEL_MIN_TEST_RECALL: "0"
        run: python -m churn_platform.ml.registry
