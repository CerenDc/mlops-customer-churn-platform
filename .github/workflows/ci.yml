name: MLOps Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and synthetic MLOps pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      CHURN_PIPELINE_USE_SYNTHETIC_DATA: "true"
      MLFLOW_EXPERIMENT_NAME: "telco-customer-churn-ci"
      MLFLOW_REGISTERED_MODEL_NAME: "telco-churn-classifier-ci"
      MODEL_MIN_TEST_ROC_AUC: "0"
      MODEL_MIN_TEST_F1: "0"
      MODEL_MIN_TEST_RECALL: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure CI runtime paths
        shell: bash
        run: |
          mkdir -p \
            "$RUNNER_TEMP/airflow" \
            "$RUNNER_TEMP/raw" \
            "$RUNNER_TEMP/processed" \
            "$RUNNER_TEMP/features" \
            "$RUNNER_TEMP/mlflow"
          {
            echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow"
            echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/orchestration/dags"
            echo "TELCO_RAW_PATH=$RUNNER_TEMP/raw/telco_customer_churn.csv"
            echo "TELCO_DELTA_PATH=$RUNNER_TEMP/processed/telco_delta"
            echo "DBT_DUCKDB_PATH=$RUNNER_TEMP/features/churn_analytics.duckdb"
            echo "MLFLOW_TRACKING_URI=sqlite:///$RUNNER_TEMP/mlflow/mlflow.db"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,orchestration]"

      - name: Validate Python imports
        run: >-
          python -c
          "import airflow, delta, duckdb, mlflow, pyspark;
          import churn_platform"

      - name: Verify Java runtime
        run: java -version

      - name: Validate Ruff lint
        run: ruff check .

      - name: Validate Ruff formatting
        run: ruff format --check .

      - name: Run Python and component tests
        run: pytest -q -m "not integration"

      - name: Validate Spark and Delta
        run: pytest -q -m integration

      - name: Initialize Airflow metadata
        run: airflow db migrate

      - name: Validate Airflow DAG
        run: |
          airflow dags reserialize
          airflow dags list-import-errors
          airflow dags list | grep mlops_customer_churn_pipeline

      - name: End-to-end synthetic MLOps smoke test
        run: >-
          airflow dags test mlops_customer_churn_pipeline
          --dagfile-path
          "$AIRFLOW__CORE__DAGS_FOLDER/churn_mlops_pipeline.py"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build MLOps runtime image
        run: docker compose build

      - name: Validate container runtime
        run: >-
          docker compose run --rm --no-deps airflow-init bash -ec
          'java -version && python -c
          "import airflow, delta, duckdb, mlflow, pyspark;
          import churn_platform"'
