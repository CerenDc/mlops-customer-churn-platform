global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: churn-metrics-exporter
    static_configs:
      - targets:
          - metrics-exporter:8000

  - job_name: churn-serving-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - serving-api:8001
