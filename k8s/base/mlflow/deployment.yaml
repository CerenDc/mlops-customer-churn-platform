apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: churn-mlops
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/part-of: churn-mlops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: churn-mlops
    spec:
      securityContext:
        fsGroup: 0
        runAsNonRoot: true
        runAsUser: 50000
      containers:
        - name: mlflow
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          args:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////opt/mlops/data/mlflow/mlflow.db
            - --artifacts-destination
            - /opt/mlops/data/mlflow/artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --workers
            - "1"
            - --allowed-hosts
            - localhost:*,127.0.0.1:*,mlflow:5000
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pipeline-data
              mountPath: /opt/mlops/data
      volumes:
        - name: pipeline-data
          persistentVolumeClaim:
            claimName: pipeline-data
