apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-db-migrate
        app.kubernetes.io/part-of: churn-mlops
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 0
        runAsNonRoot: true
        runAsUser: 50000
      containers:
        - name: migrate
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              until airflow db check; do
                echo "Waiting for the Airflow metadata database"
                sleep 2
              done
              mkdir -p "$AIRFLOW_HOME/logs"
              airflow db migrate
          envFrom:
            - configMapRef:
                name: churn-runtime-config
            - secretRef:
                name: churn-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pipeline-data
              mountPath: /opt/mlops/data
      volumes:
        - name: pipeline-data
          persistentVolumeClaim:
            claimName: pipeline-data
