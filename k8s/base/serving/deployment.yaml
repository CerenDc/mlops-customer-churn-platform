apiVersion: v1
kind: Service
metadata:
  name: serving-api
spec:
  selector:
    app.kubernetes.io/name: serving-api
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: serving-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving-api
        app.kubernetes.io/part-of: churn-mlops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
      containers:
        - name: serving-api
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - churn_platform.serving.app:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          envFrom:
            - configMapRef:
                name: churn-runtime-config
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
