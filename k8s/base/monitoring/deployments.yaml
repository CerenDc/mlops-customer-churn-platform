apiVersion: v1
kind: Service
metadata:
  name: metrics-exporter
spec:
  selector:
    app.kubernetes.io/name: metrics-exporter
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-exporter
    spec:
      securityContext:
        fsGroup: 0
        runAsNonRoot: true
        runAsUser: 50000
      containers:
        - name: metrics-exporter
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          args: [python, -m, churn_platform.monitoring.exporter, --host, 0.0.0.0]
          env:
            - name: MONITORING_METRICS_STATE_PATH
              value: /opt/mlops/data/monitoring/metrics.json
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: pipeline-data, mountPath: /opt/mlops/data}
      volumes:
        - name: pipeline-data
          persistentVolumeClaim: {claimName: pipeline-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: copy-config
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          command: [cp, /opt/mlops/monitoring/prometheus/prometheus.yml, /config/prometheus.yml]
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: prometheus-data, mountPath: /prometheus}
      volumes:
        - {name: config, emptyDir: {}}
        - name: prometheus-data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
        - name: copy-provisioning
          image: churn-mlops:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - cp -R /opt/mlops/monitoring/grafana/provisioning/. /provisioning/ && cp -R /opt/mlops/monitoring/grafana/dashboards/. /dashboards/
          volumeMounts:
            - {name: provisioning, mountPath: /provisioning}
            - {name: dashboards, mountPath: /dashboards}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: churn-secrets, key: GRAFANA_ADMIN_USER}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: churn-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 472
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: grafana-data
          persistentVolumeClaim: {claimName: grafana-data}
        - {name: provisioning, emptyDir: {}}
        - {name: dashboards, emptyDir: {}}
