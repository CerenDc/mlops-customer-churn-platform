apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: churn-mlops

resources:
  - ../../base
  - service-accounts.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
  - path: cloud-config.yaml
  - path: mlflow-cloud.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mlflow
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
      - op: remove
        path: /spec/template/spec/volumes
  - path: mlflow-identity.yaml
  - path: airflow-identity.yaml
  - path: monitoring-identity.yaml

images:
  - name: churn-mlops
    newName: 000000000000.dkr.ecr.eu-west-3.amazonaws.com/mlops-customer-churn-platform
    newTag: REPLACE_WITH_IMMUTABLE_TAG
