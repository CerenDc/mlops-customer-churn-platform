[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlops-customer-churn-platform"
version = "13.0.0"
description = "A production-style MLOps platform for customer churn prediction."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Project Contributors" }]
dependencies = [
    "boto3>=1.40,<2",
    "dbt-duckdb==1.11.0",
    "delta-spark==4.4.0",
    "evidently==0.7.21",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "mlflow==3.15.2",
    "pandas>=2.2,<3",
    "pyspark==4.2.0",
    "prometheus-client==0.26.0",
    "scikit-learn==1.9.0",
    "uvicorn>=0.41,<1",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
orchestration = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-standard==1.18.0",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/churn_platform"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring a local Java, Spark, and Delta runtime",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
